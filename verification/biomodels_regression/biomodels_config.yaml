# BioDynamics v4 — BioModels Regression Configuration (Part 8)
# -----------------------------------------------------------------------------
# 30 reference models sourced from the EBI BioModels database
# (https://www.ebi.ac.uk/biomodels/). Each entry drives one parametrized
# regression case in test_biomodels_regression.py.
#
# Coverage: the 10 core v4 pathways (EGFR_RTK / MAPK_ERK / PI3K_AKT_mTOR / p53 /
# APOPTOSIS / CELL_CYCLE / JAK_STAT / NF_KB / WNT / TGF_BETA).
#
# Field reference:
#   biomodels_id            EBI BioModels accession (also the SBML cache key)
#   pathway                 v4 pathway_class key (PATHWAY_REGISTRY)
#   species_count           expected number of SBML species in the reference model
#   expected_peak_time_min  expected time-to-peak of the dominant species (minutes)
#   expected_peak_amplitude expected peak concentration of the dominant species
#   expected_steady_state   expected steady-state concentration after t_end=120 min
#   rmse_threshold          max acceptable RMSE between v4 and reference (lower = stricter)
#   pearson_threshold       min acceptable Pearson correlation (higher = stricter)
#
# Thresholds are intentionally lenient for the scaffolding; tighten once the
# roadrunner + BioDynamics integration is wired up.
# -----------------------------------------------------------------------------

# =============================================================================
# Required anchors — one canonical reference per pathway (11 entries)
# =============================================================================
