# BioDynamics v4 — Pathway Regression Configuration (Part 9)
# -----------------------------------------------------------------------------
# 50 mechanism-level regression cases: 5 cases per pathway × 10 pathways.
# Each case describes a single biochemical step (one mechanism) and the
# structural + ODE-level assertions the v4 Pathway Specialist must satisfy.
#
# Pathways (v4 pathway_class keys):
#   EGFR_RTK, MAPK_ERK, PI3K_AKT_mTOR, p53, APOPTOSIS,
#   CELL_CYCLE, JAK_STAT, NF_KB, WNT, TGF_BETA
#
# Field reference:
#   pathway              v4 pathway_class key
#   test_name            unique short id (used in parametrize id)
#   description          human-readable description of the biochemical step
#   expected_species     species that must appear in the reaction IR for this step
#   expected_reactions   number of reactions this step contributes
#   expected_mechanism   MechanismType value the reaction must carry
#   expected_ode_terms   number of ODE RHS terms the renderer must emit
#   validation_level     deepest validation pyramid level exercised (L1..L5)
#   expected_pass        whether the case is expected to pass (false = known gap)
#   p0_bug               (optional) known P0 bug id; test is auto-skipped when set
#                        FM-001 = ODE Renderer reads non-existent substrate field
#                        FM-002 = ODE Renderer reads non-existent modifier field
#                        FM-003 = ODE Renderer emits zero-flux ODE for MM steps
# -----------------------------------------------------------------------------

# =============================================================================
# 1. EGFR_RTK — ligand binding, autophosphorylation, Grb2/SOS, Ras exchange
# =============================================================================
- pathway: "EGFR_RTK"
  test_name: "egfr_egf_binding"
