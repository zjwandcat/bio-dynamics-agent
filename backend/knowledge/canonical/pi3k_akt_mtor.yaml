# BioDynamics Canonical Reference Library — PI3K-AKT-mTOR 通路
# Task 22: 每通路唯一权威参考，所有 Benchmark "标准答案"必须基于 Canonical。
pathway: PI3K_AKT_MTOR
name: "PI3K-AKT-mTOR Signaling"

canonical_reviews:          # 权威综述 PMID 列表
  - "PMID:17255734"         # Manning & Cantley 2007 Cell（AKT/PKB 信号）

canonical_models:           # 权威 BioModels ID 列表
  - "BIOMD0000000205"       # PI3K-AKT-mTOR pathway model
  # TODO: verify BIOMD — Gold Standard 引用 BIOMD0000000056，需确认哪个为 PI3K 通路权威模型

canonical_mechanism:
  required_nodes:           # 机制节点链（大写蛋白名）
    - PI3K
    - PIP3
    - PDK1
    - AKT
    - TSC2
    - mTORC1
    - S6K
  edges:                    # 机制边（因果描述）
    - from: PI3K
      to: PIP3
      relation: activation
    - from: PIP3
      to: PDK1
      relation: activation
    - from: PIP3
      to: AKT
      relation: activation
    - from: AKT
      to: TSC2
      relation: inhibition
    - from: TSC2
      to: mTORC1
      relation: inhibition
    - from: mTORC1
      to: S6K
      relation: phosphorylation
    - from: S6K
      to: IRS1
      relation: inhibition  # 负反馈

expected_behavior:          # 动力学行为预期
  akt_peak: "5-15 min"
  mtorc1_sustained: true
  tsc2_phosphorylation: true

known_negative_feedback:    # 已知负反馈
  - S6K-IRS1
  - mTORC1-RTK

consistency_rules:          # 供 Consistency Checker 加载的自洽规则
  - rule: "AKT Peak 不能晚于 mTORC1 活化"
    assertion: "akt_peak_time < mtorc1_activation_time"
    violation_label: "akt_peak_after_mtorc1"
  - rule: "PI3K 活化不能晚于 AKT Peak"
    assertion: "pi3k_activation_time < akt_peak_time"
    violation_label: "upstream_after_downstream"
