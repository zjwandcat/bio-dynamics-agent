# BioDynamics Canonical Reference Library — TGF-β 通路
# Task 22: 每通路唯一权威参考，所有 Benchmark "标准答案"必须基于 Canonical。
pathway: TGF_BETA_SIGNALING
name: "TGF-β/SMAD Signaling"

canonical_reviews:          # 权威综述 PMID 列表
  - "PMID:10854325"         # Massague 2000 Nature Cell Biology（SMAD 信号）

canonical_models:           # 权威 BioModels ID 列表
  - "BIOMD0000000342"       # Zi2011 TGF-beta pathway (PMID:21613981)

canonical_mechanism:
  required_nodes:           # 机制节点链（大写蛋白名）
    - TGFbeta
    - TGFBR1
    - TGFBR2
    - SMAD2
    - SMAD3
    - SMAD4
    - SMAD7
    - SnoN
  edges:                    # 机制边（因果描述）
    - from: TGFbeta
      to: TGFBR1
      relation: binding
    - from: TGFbeta
      to: TGFBR2
      relation: binding
    - from: TGFBR1
      to: SMAD2
      relation: phosphorylation
    - from: TGFBR1
      to: SMAD3
      relation: phosphorylation
    - from: SMAD2
      to: SMAD4
      relation: heterodimer
    - from: SMAD3
      to: SMAD4
      relation: heterodimer
    - from: SMAD4
      to: SMAD_nuclear
      relation: nuclear_translocation
    - from: SMAD_nuclear
      to: SMAD7
      relation: transcription  # 负反馈
    - from: SMAD_nuclear
      to: SnoN
      relation: transcription  # 负反馈
    - from: SMAD7
      to: TGFBR1
      relation: inhibition
    - from: SnoN
      to: SMAD4
      relation: inhibition

expected_behavior:          # 动力学行为预期
  smad_nuclear_translocation: "15-60 min"
  smad7_feedback: "required"
  sustained: false

canonical_timeline:
  - event: "TGF-beta receptor activation"
    time_window: "1-5 min"
  - event: "SMAD2/3 phosphorylation"
    time_window: "5-15 min"
  - event: "SMAD complex nuclear translocation"
    time_window: "15-30 min"
  - event: "SMAD7 induction"
    time_window: "1-2 h"
  - event: "Negative feedback"
    present: true
    mediator: "SMAD7, SnoN"

known_negative_feedback:    # 已知负反馈
  - SMAD7
  - SnoN

consistency_rules:          # 供 Consistency Checker 加载的自洽规则
  - rule: "SMAD nuclear translocation 不能晚于 SMAD7 表达"
    assertion: "smad_nuclear_time < smad7_expression_time"
    violation_label: "smad_nuclear_after_smad7"
  - rule: "SMAD7 表达晚于 SMAD Peak"
    assertion: "smad7_expression_time > smad_peak_time"
    violation_label: "smad7_before_smad_peak"

# ============================================================================
# Task 12: Spec 补全字段（10 通路 Canonical 对齐）
# ============================================================================
expected_dynamics:          # 期望动力学（基于权威文献汇总）
  SMAD2_phosphorylation:
    peak_time: "5-15 min"
    behavior: "peaks and declines"
    must_decline: true
  SMAD_nuclear:
    peak_time: "15-30 min"
    behavior: "transient nuclear accumulation"
  SMAD7:
    peak_time: "1-2 h"
    behavior: "increasing (feedback)"

curve_requirements:         # 曲线必须满足的硬约束
  pSMAD2: "必须下降（adaptive）"
  SMAD7: "持续增加"

expected_experiments:       # 验证机制所需实验
  - name: "pSMAD2 Western blot"
    timepoints: [0, 5, 15, 30, 60, 120, 240]
    mechanism_target: "SMAD2 phosphorylation dynamics"
  - name: "SMAD7 qPCR"
    timepoints: [15, 30, 60, 120, 240]
    mechanism_target: "SMAD7 negative feedback"

forbidden_experiments:      # 不能验证磷酸化动力学的实验
  - "SMAD2 qPCR (不能反映磷酸化动力学)"

# Task 12 Spec: Benchmark 10 TGFβ Canonical Assertion
tgfb_assertions:
  smad2_phosphorylation: "peaks and declines"
  mechanism: ["SMAD7 negative feedback", "Receptor turnover"]
