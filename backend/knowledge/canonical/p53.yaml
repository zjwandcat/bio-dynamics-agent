# BioDynamics Canonical Reference Library — p53 通路
# Task 22: 每通路唯一权威参考，所有 Benchmark "标准答案"必须基于 Canonical。
pathway: P53_SIGNALING
name: "p53 DNA Damage Response Signaling"

canonical_reviews:          # 权威综述 PMID 列表
  - "PMID:14977579"         # Lahav 2004 Nature Genetics（p53-MDM2 动力学）

canonical_models:           # 权威 BioModels ID 列表
  - "BIOMD0000000252"       # Hunziker2010 p53 stress response (PMID:20624280)

canonical_mechanism:
  required_nodes:           # 机制节点链（大写蛋白名）
    - ATM
    - p53
    - MDM2
    - p21
  edges:                    # 机制边（因果描述）
    - from: DNA_damage
      to: ATM
      relation: activation
    - from: ATM
      to: p53
      relation: phosphorylation
    - from: p53
      to: MDM2
      relation: transcription
    - from: MDM2
      to: p53
      relation: degradation  # 负反馈
    - from: p53
      to: p21
      relation: transcription
    - from: p21
      to: CDK
      relation: inhibition

expected_behavior:          # 动力学行为预期
  p53_oscillation: true
  pulse_period: "5-6 hours"
  mdm2_feedback: "required"

canonical_timeline:
  - event: "ATM activation"
    time_window: "<30 min"
  - event: "p53 phosphorylation"
    time_window: "30-60 min"
  - event: "MDM2 peak"
    time_window: "1-2 h after p53"
  - event: "p53 oscillation period"
    time_window: "5-6 h"
    reference: "PMID:14977579"
  - event: "p21 induction"
    time_window: "2-4 h"
  - event: "Negative feedback"
    present: true
    mediator: "MDM2-p53"

known_negative_feedback:    # 已知负反馈
  - MDM2-p53

consistency_rules:          # 供 Consistency Checker 加载的自洽规则
  - rule: "MDM2 Peak 不能早于 p53 Peak"
    assertion: "mdm2_peak_time > p53_peak_time"
    violation_label: "mdm2_peak_before_p53_peak"
  - rule: "p53 振荡周期应在 5-6 小时"
    assertion: "5 <= p53_pulse_period <= 6"
    violation_label: "p53_oscillation_period_out_of_range"

# ============================================================================
# Task 12: Spec 补全字段（10 通路 Canonical 对齐）
# ============================================================================
expected_dynamics:          # 期望动力学（基于权威文献汇总）
  p53:
    peak_time: "30-60 min"
    behavior: "oscillation (not steady increase)"
    must_oscillate: true
    period: "5-6 hours"
  MDM2:
    peak_time: "1-2 h after p53"
    behavior: "delayed pulse following p53"
  p21:
    peak_time: "2-4 h"
    behavior: "sustained induction"

curve_requirements:         # 曲线必须满足的硬约束
  p53: "振荡（不能单调上升）"
  MDM2: "滞后于 p53 的脉冲"

expected_experiments:       # 验证机制所需实验
  - name: "p53 Western blot"
    timepoints: [0, 30, 60, 120, 240, 360, 480]
    mechanism_target: "p53 oscillation dynamics"
  - name: "MDM2 Western blot"
    timepoints: [0, 60, 120, 240, 360]
    mechanism_target: "MDM2 negative feedback"

forbidden_experiments:      # 不能验证振荡动力学的实验
  - "p53 qPCR (不能反映振荡)"

# Task 12 Spec: Benchmark 06 p53 DNA Damage Canonical Assertion
dna_damage_assertions:
  pathway: "ATM → p53 → MDM2 → negative feedback"
  behavior: "oscillation (not steady increase)"
  mechanism: "MDM2-mediated negative feedback"
