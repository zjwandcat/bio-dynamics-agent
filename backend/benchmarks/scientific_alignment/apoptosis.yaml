# 从 knowledge/canonical/apoptosis.yaml.forbidden_experiments 复制
forbidden_experiments:
  - "Caspase-3 qPCR (蛋白活性需要 activity assay)"

# 禁止出现的模式（regex + reason）
forbidden_patterns:
  - pattern: "Caspase.?3.*linear.*increase"
    reason: "Caspase-3 应 threshold/switch 激活，不能线性增加"
  - pattern: "Caspase.?3.*gradual.*accumulation"
    reason: "违反 bistable switch / MOMP 不可逆承诺机制"
  - pattern: "MOMP.*reversible"
    reason: "MOMP 是不可逆承诺点（irreversible commitment）"
  - pattern: "Caspase.?3 qPCR"
    reason: "Caspase-3 qPCR 不能反映蛋白活性，需用 activity assay"
  - pattern: "no.*MOMP.*commitment"
    reason: "必须解释 MOMP 不可逆承诺机制"
  - pattern: "no.*PubMed"
    reason: "必须引用 PubMed 权威文献"
  - pattern: "no.*BioModels"
    reason: "必须引用 BioModels 模型比较"

# 验收标准（对齐 spec acceptance_criteria）
acceptance_criteria:
  mechanism_nodes_required: true
  mechanism_node_min_coverage: 0.8
  pubmed_min_count: 2                    # Apoptosis canonical reviews 较多
  biomodels_min_count: 0                 # Canonical 中 apoptosis models 为空
  experiment_min_count: 2
  hallucination_tolerance: 0
  curve_metric_pass_min: 6
  forbidden_experiment_blocked: true
  forbidden_pattern_absent: true
  must_explain_momp_commitment: true      # 必须解释 MOMP 不可逆承诺
  caspase3_must_be_switch_like: true      # Caspase-3 必须开关式激活
  momp_must_be_irreversible: true         # MOMP 必须不可逆

# 从 knowledge/canonical/apoptosis.yaml.trail_assertions 复制
