    peak_time_min: [60, 120]
    peak_amplitude: [0.8, 1.0]
    rise_time_min: [10, 30]               # 开关式快速上升
    half_decay_min: null                  # 不可逆，不下降
    adaptation_ratio: null
    steady_state: [0.9, 1.0]              # 持续高位（不可逆）
    oscillation: false
    auc: [80, 250]
