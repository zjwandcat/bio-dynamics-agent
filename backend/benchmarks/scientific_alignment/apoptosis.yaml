# Benchmark 08: Apoptosis — TRAIL 刺激后 Caspase-3 阈值激活
benchmark_id: apoptosis_trail_caspase3_threshold
pathway: apoptosis
category: positive
question: >
  仿真 TRAIL 刺激后 Caspase-3 激活动力学。Caspase-3 激活是线性增加还是阈值/开关式？
  请解释 MOMP 不可逆承诺与 bistable switch 机制，并仿真 4 h 动力学。

expected_answer: >
  TRAIL → Fas/DR4/DR5 → Caspase-8 激活 → tBID → BAX/BAK → MOMP（线粒体外膜通透化）→
  Cytochrome c 释放 → Apoptosome → Caspase-9 → Caspase-3 激活（1-2 h）。
  Caspase-3 激活表现为 threshold / switch-like（双稳态开关），而非线性增加：
  在刺激低于阈值时几乎不激活，超过阈值后快速全激活（all-or-none）。
  MOMP 是不可逆承诺点（irreversible commitment），一旦发生细胞必然走向死亡。
  tBID 放大环路（extrinsic → intrinsic crosstalk）增强开关特性。
  XIAP 抑制 Caspase-3 但被 MOMP 释放的 SMAC 拮抗。
  禁止回答"Caspase-3 线性增加"——这违反 threshold/switch 机制。

# 从 knowledge/canonical/apoptosis.yaml.canonical_mechanism.required_nodes 复制
canonical_mechanism_nodes:
  - Fas
  - Caspase8
  - Caspase3
  - BAX
  - BAK
  - tBID
  - XIAP

# 从 knowledge/canonical/apoptosis.yaml.canonical_reviews 复制
canonical_reviews:
  - "PMID:18073771"         # Taylor 2008 Nat Rev MCB（凋亡控制性拆除）
  - "PMID:14744432"         # Danial & Korsmeyer 2004 Cell（细胞死亡关键控制点）
  - "PMID:15286356"         # Green & Kroemer 2004 Science（线粒体细胞死亡病理生理学）

# 从 knowledge/canonical/apoptosis.yaml.canonical_models 复制（Canonical 中为空）
canonical_models: []

# 期望动力学（基于 trail_assertions）
expected_dynamics:
  - molecule: Caspase3
    peak_time: [60, 120]
    behavior: "threshold / switch-like"
    switch_like: true
    irreversible: true
  - molecule: MOMP
    peak_time: [30, 60]
    behavior: "all-or-none commitment"
  - molecule: Cytochrome_C_release
    peak_time: [30, 60]
    behavior: "rapid release after MOMP"
  - molecule: Caspase8
    peak_time: [10, 30]
    behavior: "rapid activation (initiator)"

