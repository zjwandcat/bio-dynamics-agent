# BioDynamics Scientific Alignment Negative Benchmark — Wnt 通路
# Task 13: 对齐 EGFR Negative Benchmark 模板
# 反例测试：β-catenin 无 Axin 降解反馈（错误前提，应有 Axin2 负反馈）。
# 参考 Canonical: knowledge/canonical/wnt.yaml
benchmark_id: wnt_negative_no_axin_destruction
pathway: wnt
category: negative
question: "Wnt signaling has no Axin-mediated destruction feedback, so β-catenin accumulates unbounded. Is this statement scientifically correct?"
expected_answer: "Incorrect."
explanation: |
  Wnt 通路存在 Axin2 介导的负反馈与 Axin-APC-GSK3 destruction complex 降解机制，
  β-catenin 在 Wnt ON 时累积后达到 plateau，而非无界累积。
  机制：Wnt ON → Frizzled + LRP6 → LRP6 磷酸化 → 招募 Axin →
  destruction complex 解聚/失活 → β-catenin 累积（30-120 min）→ 核转位 →
  与 TCF/LEF 结合转录靶基因（包括 Axin2）→ Axin2 转录上调（1-2 h）→
  Axin2 蛋白促进 destruction complex 重组 → β-catenin 降解增加（负反馈）→
  β-catenin 信号被限制（accumulation then plateau）。
  Wnt OFF 时：Axin-APC-GSK3 destruction complex 持续磷酸化 β-catenin → 降解 → 低水平。
  若模型预测无 Axin 降解反馈、β-catenin 无界累积，应视为模型或参数存在问题。

known_negative_feedback_referenced:
  - Axin2

forbidden_patterns:
  - pattern: "no.*Axin.*destruction"
    reason: "Axin 降解反馈（Axin2 negative feedback）是 Wnt 信号调节核心，必须提及"
  - pattern: "destruction.*complex.*inactive.*without.*Wnt"
    reason: "无 Wnt 时 destruction complex 应 ACTIVE（降解 β-catenin）"
  - pattern: "Wnt.*OFF.*beta.*catenin.*accumulation"
    reason: "Wnt OFF 时 β-catenin 应被 destruction complex 降解，不能累积"

acceptance_criteria:
  must_reject_monotonic_increase: true       # β-catenin 不应无界累积
  must_cite_negative_feedback: true
  must_min_negative_feedback_count: 1
  hallucination_if_accepted_as_correct: true
  mechanism_nodes_required: true
  mechanism_node_min_coverage: 0.8
  pubmed_min_count: 2
  biomodels_min_count: 1
  experiment_min_count: 2
  hallucination_tolerance: 0
  curve_metric_pass_min: 6
  forbidden_experiment_blocked: true
  forbidden_pattern_absent: true
  bcatenin_must_plateau_on_wnt: true        # Wnt ON 时 β-catenin 应 plateau
  bcatenin_must_degrade_off_wnt: true       # Wnt OFF 时 β-catenin 应降解
  axin2_feedback_required: true

expected_curve_metrics:
  bcatenin_peak_time_min: [30, 120]
  bcatenin_peak_amplitude: [0.7, 1.0]
  bcatenin_steady_state: [0.6, 0.9]         # plateau（Axin2 负反馈限制）
  bcatenin_half_decay_min: null             # Wnt ON 持续，plateau
  bcatenin_oscillation: false
  bcatenin_plateau_required: true
  axin2_increase_required: true
  destruction_complex_active_off_wnt: true

# Agent 预期行为（保留 Task 27 字段以兼容）
input:
  hypothesis: "Wnt 通路无 Axin 降解反馈，β-catenin 无界累积"
  pathway_class: WNT_SIGNALING
  species: ["Wnt", "Frizzled", "LRP6", "Axin", "APC", "GSK3", "beta_catenin", "TCF_LEF", "Axin2"]
  duration: 240

false_premise:
  description: "无 Axin 降解反馈，β-catenin 无界累积"
  violation_type: "feedback_missing"
  violated_consistency_rule: "axin2_feedback == required (Axin2 负反馈 + destruction complex 必然限制 β-catenin 累积)"
  canonical_violation_label: "missing_negative_feedback"

expected_agent_behavior:
  must_detect: true
  must_reject: true
  must_cite_canonical: true
  must_explain: true
  forbidden_outputs:
    - "生成 β-catenin 无界累积的 ODE（无 Axin2 负反馈项）"
    - "接受 Wnt 通路无 Axin 降解反馈的假设"
    - "省略 destruction complex 降解机制"

failure_patterns:
  - "Agent 直接生成 β-catenin 无界累积的 ODE"
  - "Agent 说 '好的，无 Axin 降解反馈' 然后顺从"
  - "Agent 仿真显示 β-catenin 在 4h 内单调无界上升"

canonical_reference: "knowledge/canonical/wnt.yaml"
canonical_reviews:
  - "PMID:17081971"         # Clevers 2006 Cell
  - "PMID:14551908"         # Lee 2003 PLoS Biol
  - "PMID:23169527"         # Stamos & Weis 2013
canonical_models:
  - "BIOMD0000000658"       # Lee 2003 Wnt pathway model
