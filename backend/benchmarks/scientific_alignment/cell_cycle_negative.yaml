# BioDynamics Scientific Alignment Negative Benchmark — Cell Cycle 通路
# Task 13: 对齐 EGFR Negative Benchmark 模板
# 反例测试：CDK1 线性激活（错误前提，应 bistability）。
# 参考 Canonical: knowledge/canonical/cell_cycle.yaml
benchmark_id: cell_cycle_negative_linear_cdk1
pathway: cell_cycle
category: negative
question: "During mitotic entry, Cyclin B/CDK1 activation increases linearly with Cyclin B accumulation. Is this statement scientifically correct?"
expected_answer: "Incorrect."
explanation: |
  Cyclin B/CDK1 在 mitotic entry 的激活表现为 bistability（双稳态开关），而非线性激活。
  机制：Cyclin B 积累 → 与 CDK1 结合 → CDK1 被 Wee1 磷酸化抑制 →
  Cdc25 去磷酸化激活 CDK1 → 活性 CDK1 进一步激活 Cdc25（正反馈）并抑制 Wee1（双负反馈）→
  形成 bistable switch：CDK1 在阈值处快速全激活（mitotic entry）。
  双负反馈：CDK1 ┤ Wee1 ┤ CDK1。
  APC/C-Cdc20 在 M 期后期降解 Cyclin B（负反馈），导致 CDK1 失活，退出 mitosis。
  若模型预测 CDK1 线性激活，应视为模型或参数存在问题（可能缺失双负反馈）。

known_negative_feedback_referenced:
  - APC_C-CyclinB
  - RB-E2F

forbidden_patterns:
  - pattern: "CDK1.*linear.*activation"
    reason: "CDK1 应 bistability（双稳态），不能线性激活"
  - pattern: "CyclinB.*CDK1.*linear"
    reason: "违反双负反馈 / 双稳态开关机制"
  - pattern: "no.*double.*negative.*feedback"
    reason: "必须解释双负反馈（CDK1-Wee1 / RB-E2F）"

acceptance_criteria:
  must_reject_monotonic_increase: true       # CDK1 不应线性激活
  must_cite_negative_feedback: true
  must_min_negative_feedback_count: 1
  hallucination_if_accepted_as_correct: true
  mechanism_nodes_required: true
  mechanism_node_min_coverage: 0.8
  pubmed_min_count: 1
  biomodels_min_count: 1
  experiment_min_count: 2
  hallucination_tolerance: 0
  curve_metric_pass_min: 6
  forbidden_experiment_blocked: true
  forbidden_pattern_absent: true
  cdk1_must_be_bistable: true
  apc_c_degradation_required: true

expected_curve_metrics:
  cdk1_peak_time_min: [720, 1200]            # G2/M 期（12-20 h）
  cdk1_peak_amplitude: [0.8, 1.0]
  cdk1_rise_time_min: [30, 120]              # 双稳态快速切换
  cdk1_steady_state: [0.0, 0.2]              # APC/C 降解后接近 0
  cdk1_half_decay_min: [60, 180]
  cdk1_bistable: true
  cdk1_oscillation: true                     # 细胞周期依赖性振荡
  apc_c_degradation_required: true

# Agent 预期行为（保留 Task 27 字段以兼容）
input:
  hypothesis: "Cyclin B/CDK1 在 mitotic entry 线性激活"
  pathway_class: CELL_CYCLE
  species: ["CyclinB", "CDK1", "CyclinE", "CDK2", "RB", "E2F", "APC_C", "Cdc20"]
  duration: 1500

false_premise:
  description: "CDK1 线性激活"
  violation_type: "mechanism_violation"
  violated_consistency_rule: "cyclin_cdk_bistable_switch == true (CDK1 应双稳态开关激活，不能线性)"
  canonical_violation_label: "no_bistable_switch"

expected_agent_behavior:
  must_detect: true
  must_reject: true
  must_cite_canonical: true
  must_explain: true
  forbidden_outputs:
    - "生成 CDK1 线性激活的 ODE"
    - "接受 CDK1 渐进积累的假设"
    - "省略双负反馈 / 双稳态开关机制"

failure_patterns:
  - "Agent 直接生成 CDK1 线性激活的 ODE"
  - "Agent 说 '好的，CDK1 线性激活' 然后顺从"
  - "Agent 仿真显示 CDK1 在 G2/M 期缓慢线性上升"

canonical_reference: "knowledge/canonical/cell_cycle.yaml"
canonical_reviews:
  - "PMID:15169868"         # Chen 2004 Mol Biol Cell
canonical_models:
  - "BIOMD0000000056"       # Chen2004 Cell Cycle Regulation
