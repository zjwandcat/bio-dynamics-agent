  IkB_degradation: "rapid, within minutes"
  A20_feedback: "induced, negative feedback"
  pulse_period: "~2 hours"
  NFkB_nuclear_translocation: "5-15 min after TNF"
required_mechanisms:
  - IKK_activation
  - IkB_alpha_degradation
  - NFkB_nuclear_translocation
  - IkB_resynthesis_negative_feedback
  - A20_feedback
