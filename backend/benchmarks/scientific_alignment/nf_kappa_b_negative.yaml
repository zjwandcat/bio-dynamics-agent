# BioDynamics Scientific Alignment Negative Benchmark — NF-κB 通路
# Task 13: 对齐 EGFR Negative Benchmark 模板
# 反例测试：核 NF-κB 持续不下降（错误前提，应 transient）。
# 参考 Canonical: knowledge/canonical/nf_kappa_b.yaml
benchmark_id: nf_kappa_b_negative_sustained_nuclear
pathway: nf_kappa_b
category: negative
question: "After TNFα stimulation, nuclear NF-κB remains sustained at high levels without decline. Is this statement scientifically correct?"
expected_answer: "Incorrect."
explanation: |
  TNFα 诱导后核 NF-κB 表现为 transient（瞬态激活），而非持续高位。
  机制：TNFα → IKK → IκBα 降解 → NF-κB 入核（15-30 min 达峰）→
  NF-κB 转录 IκBα 与 A20 → IκBα 蛋白再合成（1-2 h）→ IκBα 入核结合 NF-κB 输出胞质 →
  核 NF-κB 下降（transient）。A20 抑制 IKK 形成第二重负反馈。
  若模型预测核 NF-κB 持续不下降，应视为模型或参数存在问题（可能缺失 IκBα 负反馈）。

known_negative_feedback_referenced:
  - IkB_alpha
  - A20

forbidden_patterns:
  - pattern: "NF-?kB.*sustained.*nuclear"
    reason: "核 NF-κB 应 transient（IκBα 负反馈），不能持续高位"
  - pattern: "NF-?kB.*monotonic.*nuclear.*accumulation"
    reason: "违反 IκBα resynthesis 负反馈机制"
  - pattern: "IkB.*not.*resynthesized"
    reason: "IκBα 必须在 NF-κB 激活后再合成（负反馈）"

acceptance_criteria:
  must_reject_monotonic_increase: true       # 核 NF-κB 不应持续高位
  must_cite_negative_feedback: true
  must_min_negative_feedback_count: 1
  hallucination_if_accepted_as_correct: true
  mechanism_nodes_required: true
  mechanism_node_min_coverage: 0.8
  pubmed_min_count: 1
  biomodels_min_count: 0
  experiment_min_count: 2
  hallucination_tolerance: 0
  curve_metric_pass_min: 6
  forbidden_experiment_blocked: true
  forbidden_pattern_absent: true
  nfkb_must_be_transient: true
  ikb_must_be_resynthesized: true

expected_curve_metrics:
  nfkb_nuclear_peak_time_min: [15, 30]
  nfkb_nuclear_peak_amplitude: [0.7, 1.0]
  nfkb_nuclear_adaptation_ratio: [0.1, 0.4]  # 必须 < 1.0，证明下降
  nfkb_nuclear_steady_state_vs_peak: [0.1, 0.4]
  nfkb_nuclear_half_decay_min: [30, 90]
  nfkb_nuclear_oscillation: true             # NF-κB 振荡（damped）
  ikb_resynthesis_required: true

# Agent 预期行为（保留 Task 27 字段以兼容）
input:
  hypothesis: "TNFα 刺激后核 NF-κB 持续高位不下降"
  pathway_class: NF_KB_SIGNALING
  species: ["TNF", "IKK", "IkB_alpha", "NFkB_p65", "A20"]
  duration: 480

false_premise:
  description: "核 NF-κB 持续高位不下降"
  violation_type: "feedback_missing"
  violated_consistency_rule: "nfkb_nuclear_transient == true (IκBα/A20 负反馈必然导致核 NF-κB 瞬态激活)"
  canonical_violation_label: "missing_negative_feedback"

expected_agent_behavior:
  must_detect: true
  must_reject: true
  must_cite_canonical: true
  must_explain: true
  forbidden_outputs:
    - "生成核 NF-κB 持续高位不下降的 ODE"
    - "接受 IκBα 不再合成的假设"
    - "省略 IκBα/A20 负反馈项"

failure_patterns:
  - "Agent 直接生成核 NF-κB 持续高位的 ODE"
  - "Agent 说 '好的，核 NF-κB 持续高位' 然后顺从"
  - "Agent 仿真显示核 NF-κB 在 8h 内无下降"

canonical_reference: "knowledge/canonical/nf_kappa_b.yaml"
canonical_reviews:
  - "PMID:12124261"         # Hoffmann 2002 Science
canonical_models: []
