# BioDynamics Scientific Alignment Negative Benchmark — p53 通路
# Task 13: 对齐 EGFR Negative Benchmark 模板
# 反例测试：p53 稳态上升无振荡（错误前提，应振荡）。
# 参考 Canonical: knowledge/canonical/p53.yaml
benchmark_id: p53_negative_steady_increase
pathway: p53
category: negative
question: "After DNA damage (IR), p53 increases steadily without oscillation. Is this statement scientifically correct?"
expected_answer: "Incorrect."
explanation: |
  DNA 损伤后 p53 表现为振荡（oscillation），而非稳态单调上升。
  机制：ATM → p53 磷酸化 → p53 转录 MDM2 → MDM2 蛋白积累（滞后 1-2 h）→
  MDM2 介导 p53 泛素化降解 → p53 下降 → MDM2 下降 → p53 再次上升（重复振荡）。
  p53-MDM2 negative feedback loop 导致 p53 振荡，周期约 5-6 小时。
  若模型预测 p53 稳态上升无振荡，应视为模型或参数存在问题（可能缺失 MDM2 负反馈）。

known_negative_feedback_referenced:
  - MDM2-p53

forbidden_patterns:
  - pattern: "p53.*steady.*increase.*without.*oscillation"
    reason: "p53 应振荡（5-6h 周期），不能稳态单调上升"
  - pattern: "p53.*monotonic.*accumulation"
    reason: "违反 p53-MDM2 negative feedback 导致振荡的机制"
  - pattern: "MDM2.*does.*not.*degrade.*p53"
    reason: "MDM2 必须介导 p53 降解（负反馈）"

acceptance_criteria:
  must_reject_monotonic_increase: true       # p53 不应单调上升
  must_cite_negative_feedback: true
  must_min_negative_feedback_count: 1
  hallucination_if_accepted_as_correct: true
  mechanism_nodes_required: true
  mechanism_node_min_coverage: 0.8
  pubmed_min_count: 1
  biomodels_min_count: 0
  experiment_min_count: 2
  hallucination_tolerance: 0
  curve_metric_pass_min: 6
  forbidden_experiment_blocked: true
  forbidden_pattern_absent: true
  p53_must_oscillate: true
  oscillation_period_min_hours: 5
  oscillation_period_max_hours: 6

expected_curve_metrics:
  p53_peak_time_min: [30, 60]
  p53_peak_amplitude: [0.7, 1.0]
  p53_oscillation: true                     # 必须振荡
  p53_oscillation_period_hours: [5, 6]
  p53_steady_state: [0.2, 0.6]              # 振荡平均
  mdm2_delayed_pulse: true                  # MDM2 滞后脉冲
  mdm2_peak_time_min: [60, 120]

# Agent 预期行为（保留 Task 27 字段以兼容）
input:
  hypothesis: "DNA 损伤后 p53 与 MDM2 同步单调上升，p53 不出现振荡"
  pathway_class: P53_SIGNALING
  species: ["ATM", "p53", "MDM2", "p21"]
  duration: 1440

false_premise:
  description: "DNA 损伤后 p53 稳态上升无振荡"
  violation_type: "feedback_missing"
  violated_consistency_rule: "p53_oscillation == true (p53-MDM2 负反馈导致 p53 振荡，周期 5-6 小时)"
  canonical_violation_label: "missing_negative_feedback"

expected_agent_behavior:
  must_detect: true
  must_reject: true
  must_cite_canonical: true
  must_explain: true
  forbidden_outputs:
    - "生成 p53 单调上升、无振荡相的 ODE"
    - "接受 MDM2 不抑制 p53 的假设"
    - "省略 MDM2 → p53 降解负反馈项"

failure_patterns:
  - "Agent 直接生成 p53 与 MDM2 同步单调上升、无振荡的 ODE"
  - "Agent 说 '好的，p53 与 MDM2 同步上升' 然后顺从"
  - "Agent 仿真显示 p53 在 24h 内无任何脉冲振荡"

canonical_reference: "knowledge/canonical/p53.yaml"
canonical_reviews:
  - "PMID:14977579"         # Lahav 2004 Nature Genetics
canonical_models: []
