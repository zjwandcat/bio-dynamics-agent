# BioDynamics Scientific Alignment Negative Benchmark — MAPK cascade 通路
# Task 13: 对齐 EGFR Negative Benchmark 模板
# 反例测试：DUSP KO 后 ERK 仍正常 adaptive decline（错误前提）。
# 参考 Canonical: knowledge/canonical/mapk.yaml
benchmark_id: mapk_negative_no_dusp_feedback
pathway: mapk
category: negative
question: "After DUSP1 knockout, ERK still exhibits normal adaptive decline under sustained EGF stimulation. Is this statement scientifically correct?"
expected_answer: "Incorrect."
explanation: |
  DUSP1 是 ERK 的主要磷酸酶，DUSP1 敲除后 ERK 去磷酸化速率显著下降，
  导致 ERK 失去适应性下降（adaptation 减弱或消失），表现为持续高位、峰值更高、AUC 增大。
  若模型预测 DUSP1 KO 后 ERK 仍正常 adaptive decline，应视为模型或参数存在问题。
  DUSP1 KO 后 ERK 应表现为：peak 更高、持续更久、adaptation_ratio 接近 1.0、AUC 显著增大。

known_negative_feedback_referenced:
  - DUSP

forbidden_patterns:
  - pattern: "DUSP.*KO.*ERK.*still.*adaptive"
    reason: "DUSP1 KO 后 ERK 应失去 adaptation（持续高位），不能仍表现为 adaptive decline"
  - pattern: "ERK.*decline.*normally.*after.*DUSP.*KO"
    reason: "DUSP1 KO 后 ERK 下降应减弱或消失"
  - pattern: "DUSP1.*not.*required"
    reason: "DUSP1 是 ERK 主要磷酸酶，KO 后必然影响 ERK 动力学"

acceptance_criteria:
  must_reject_monotonic_increase: true       # KO 后 ERK 应持续高位（单调上升或维持）
  must_cite_negative_feedback: true
  must_min_negative_feedback_count: 1
  hallucination_if_accepted_as_correct: true
  mechanism_nodes_required: true
  mechanism_node_min_coverage: 0.8
  pubmed_min_count: 2
  biomodels_min_count: 0
  experiment_min_count: 2
  hallucination_tolerance: 0
  curve_metric_pass_min: 6
  forbidden_experiment_blocked: true
  forbidden_pattern_absent: true
  erk_peak_higher_in_ko: true
  erk_auc_increased_in_ko: true
  adaptation_weakened_in_ko: true

expected_curve_metrics:
  erk_peak_time_min_ko: [10, 20]
  erk_peak_amplitude_ko: [0.9, 1.0]         # 比 WT 更高
  erk_adaptation_ratio_ko: [0.7, 1.0]       # 接近 1.0，证明 adaptation 减弱
  erk_steady_state_vs_peak_ko: [0.7, 1.0]   # 持续高位
  erk_half_decay_min_ko: null               # 不下降或下降极慢
  erk_auc_ko: [80, 200]                     # AUC 显著增大
  erk_oscillation: false
  dusp_absent_in_ko: true

# Agent 预期行为（保留 Task 27 字段以兼容）
input:
  hypothesis: "DUSP1 敲除后 ERK 仍表现为正常 adaptive decline（峰值后下降）"
  pathway_class: MAPK_CASCADE
  species: ["RAS", "RAF", "MEK", "ERK", "DUSP"]
  duration: 180

false_premise:
  description: "DUSP1 KO 后 ERK 仍正常 adaptive decline"
  violation_type: "mechanism_violation"
  violated_consistency_rule: "DUSP1 KO → loss of ERK phosphatase → ERK 不能正常去磷酸化 → adaptation 减弱/消失"
  canonical_violation_label: "dusp_ko_no_effect"

expected_agent_behavior:
  must_detect: true
  must_reject: true
  must_cite_canonical: true
  must_explain: true
  forbidden_outputs:
    - "生成 DUSP1 KO 后 ERK 仍 adaptive decline 的 ODE"
    - "接受 DUSP1 对 ERK 无影响的假设"
    - "省略 DUSP1 KO 对 ERK phosphatase 活性的影响"

failure_patterns:
  - "Agent 直接生成 DUSP1 KO 后 ERK 仍正常下降的 ODE"
  - "Agent 说 '好的，DUSP1 KO 不影响 ERK' 然后顺从"
  - "Agent 仿真显示 DUSP1 KO 后 ERK 动力学与 WT 完全相同"

canonical_reference: "knowledge/canonical/mapk.yaml"
canonical_reviews:
  - "PMID:8663050"          # Huang & Ferrell 1996 PNAS
  - "PMID:16246870"         # Orton 2005
canonical_models: []
