# BioDynamics Scientific Alignment Gold Standard — p53 通路
# 唯一权威"标准答案"，禁止 Codex/Agent 自行定义。
# 参考：Lahav 2004 (PMID:14977579) / Lev Bar-Or p53 振荡模型
