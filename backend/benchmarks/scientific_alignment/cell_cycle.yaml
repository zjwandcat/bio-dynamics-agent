    timepoints: [0, 4, 8, 12, 16]
    target: "CyclinE_pRb"

# 从 knowledge/canonical/cell_cycle.yaml.forbidden_experiments 复制
forbidden_experiments:
  - "CDK1 qPCR (蛋白活性需要 Western)"

# 禁止出现的模式（regex + reason）
forbidden_patterns:
  - pattern: "CDK1.*linear.*activation"
    reason: "CDK1 应 bistability（双稳态），不能线性激活"
  - pattern: "CyclinB.*CDK1.*linear"
    reason: "违反双负反馈 / 双稳态开关机制"
  - pattern: "no.*double.*negative.*feedback"
    reason: "必须解释双负反馈（CDK1-Wee1 / RB-E2F）"
  - pattern: "CDK1 qPCR"
    reason: "CDK1 qPCR 不能反映蛋白活性，需用 Western blot"
  - pattern: "no.*APC.*C.*degradation"
    reason: "APC/C 降解 Cyclin B 是退出 mitosis 的关键，必须提及"
  - pattern: "no.*PubMed"
    reason: "必须引用 PubMed 权威文献"
  - pattern: "no.*BioModels"
    reason: "必须引用 BioModels 模型比较"

