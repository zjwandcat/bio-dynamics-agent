# Benchmark 09: Cell Cycle — Cyclin B/CDK1 mitotic entry 双稳态开关
benchmark_id: cell_cycle_mitotic_entry_bistability
pathway: cell_cycle
category: positive
question: >
  解释 Cyclin B/CDK1 在 mitotic entry（M 期进入）的激活机制。
  为何 Cyclin B/CDK1 激活表现为 bistability（双稳态）而非线性？
  请解释双负反馈机制并仿真一个细胞周期（约 24 h）动力学。

expected_answer: >
  Cyclin B 在 G2 期积累 → 与 CDK1 结合 → CDK1 被 Wee1 磷酸化抑制（Tyr15）→
  Cdc25 去磷酸化激活 CDK1 → 活性 CDK1 进一步激活 Cdc25（正反馈）并抑制 Wee1（双负反馈）→
  形成 bistable switch：CDK1 在阈值处快速全激活（mitotic entry）。
  双负反馈：CDK1 ┤ Wee1 ┤ CDK1（Wee1 抑制 CDK1，CDK1 反过来抑制 Wee1）。
  APC/C-Cdc20 在 M 期后期降解 Cyclin B（负反馈），导致 CDK1 失活，退出 mitosis。
  Cyclin B/CDK1 激活表现为 bistability（双稳态），不是线性激活。
  G1/S 转换（CyclinE-CDK2 / RB-E2F）也是双稳态（double-negative feedback）。
  禁止回答"CDK1 线性激活"——这违反双稳态开关机制。

# 从 knowledge/canonical/cell_cycle.yaml.canonical_mechanism.required_nodes 复制
canonical_mechanism_nodes:
  - CyclinD-CDK4/6
  - CyclinE-CDK2
  - CyclinB-CDK1
  - RB
  - E2F
  - APC_C
  - Cdc20

# 从 knowledge/canonical/cell_cycle.yaml.canonical_reviews 复制
canonical_reviews:
  - "PMID:15169868"         # Chen 2004 Mol Biol Cell（budding yeast cell cycle model）

# 从 knowledge/canonical/cell_cycle.yaml.canonical_models 复制
canonical_models:
  - "BIOMD0000000056"       # Chen2004 Cell Cycle Regulation (budding yeast)

# 期望动力学（基于 mitotic_entry_assertions）
expected_dynamics:
  - molecule: CyclinB_CDK1
    peak_time: [720, 1200]                # G2/M 期（12-20 h）
    behavior: "bistability (non-linear)"
    switch_like: true
  - molecule: CyclinE_CDK2
    peak_time: [240, 480]                 # G1/S 转换（4-8 h）
    behavior: "G1/S bistable switch"
  - molecule: RB_E2F
    peak_time: [240, 480]
    behavior: "bistability (double-negative feedback)"
  - molecule: APC_C
    peak_time: [1200, 1440]               # M 期后期（20-24 h）
    behavior: "activation for CyclinB degradation"

# 8 项 Curve Metrics 期望值
expected_curve_metrics:
  - molecule: CyclinB_CDK1
    peak_time_min: [720, 1200]
    peak_amplitude: [0.8, 1.0]
    rise_time_min: [30, 120]              # 双稳态快速切换
    half_decay_min: [60, 180]             # APC/C 降解
    adaptation_ratio: [0.0, 0.2]          # 降解后接近 0
    steady_state: [0.0, 0.2]
    oscillation: true                     # 细胞周期依赖性振荡
    auc: [300, 800]
  - molecule: CyclinE_CDK2
    peak_time_min: [240, 480]
    peak_amplitude: [0.7, 1.0]
    rise_time_min: [30, 90]
    half_decay_min: [60, 180]
    adaptation_ratio: [0.1, 0.3]
    steady_state: [0.05, 0.2]
    oscillation: true
    auc: [150, 500]
  - molecule: RB_phosphorylation
    peak_time_min: [240, 480]
    peak_amplitude: [0.7, 1.0]
    rise_time_min: [60, 180]
    half_decay_min: [300, 600]
    adaptation_ratio: [0.3, 0.6]
    steady_state: [0.3, 0.6]
    oscillation: true
    auc: [200, 600]
  - molecule: APC_C
    peak_time_min: [1200, 1440]
    peak_amplitude: [0.7, 1.0]
    rise_time_min: [30, 120]
    half_decay_min: [120, 300]
    adaptation_ratio: [0.1, 0.4]
    steady_state: [0.1, 0.4]
    oscillation: true
    auc: [200, 600]

# 从 knowledge/canonical/cell_cycle.yaml.expected_experiments 复制
expected_experiments:
  - name: "Cyclin B1 / pCDK1 Western blot"
    technique: "Western blot"
    timepoints: [0, 4, 8, 12, 16, 20, 24]
    target: "CyclinB1_pCDK1"
  - name: "Cyclin E / pRb Western blot"
