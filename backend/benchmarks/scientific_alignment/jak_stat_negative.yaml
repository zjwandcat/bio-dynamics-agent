# BioDynamics Scientific Alignment Negative Benchmark — JAK-STAT 通路
# Task 13: 对齐 EGFR Negative Benchmark 模板
# 反例测试：JAK-STAT 无 SOCS 反馈（错误前提，应有 SOCS3 负反馈）。
# 参考 Canonical: knowledge/canonical/jak_stat.yaml
benchmark_id: jak_stat_negative_no_socs_feedback
pathway: jak_stat
category: negative
question: "JAK-STAT signaling has no SOCS-mediated negative feedback, so STAT5 remains sustained after cytokine stimulation. Is this statement scientifically correct?"
expected_answer: "Incorrect."
explanation: |
  JAK-STAT 通路存在 SOCS3/CIS 介导的负反馈，STAT5 表现为 transient（适应性下降），
  而非持续高位。
  机制：Cytokine → 细胞因子受体 → JAK 激酶激活 → JAK 磷酸化受体 →
  STAT5 被招募并磷酸化（5-15 min 达峰）→ STAT5 二聚化 → 核转位 →
  转录 SOCS3 与 CIS → SOCS3 蛋白积累（30-60 min）→ SOCS3 结合 JAK 抑制其激酶活性 →
  CIS 结合细胞因子受体抑制信号 → STAT5 磷酸化下降（adaptive decline）。
  SOCS3-mediated JAK negative feedback 是 STAT5 adaptive decline 的核心机制。
  若模型预测 JAK-STAT 无 SOCS 反馈、STAT5 持续高位，应视为模型或参数存在问题。

known_negative_feedback_referenced:
  - SOCS3
  - CIS

forbidden_patterns:
  - pattern: "no.*SOCS.*feedback"
    reason: "SOCS3 负反馈是 STAT5 adaptive decline 的核心机制，必须提及"
  - pattern: "JAK.?STAT.*no.*SOCS"
    reason: "违反 SOCS3-mediated JAK negative feedback 机制"
  - pattern: "STAT5.*sustained.*high"
    reason: "pSTAT5 应 transient decline（SOCS3 负反馈），不能持续高位"

acceptance_criteria:
  must_reject_monotonic_increase: true       # STAT5 不应持续高位
  must_cite_negative_feedback: true
  must_min_negative_feedback_count: 1
  hallucination_if_accepted_as_correct: true
  mechanism_nodes_required: true
  mechanism_node_min_coverage: 0.8
  pubmed_min_count: 2
  biomodels_min_count: 0
  experiment_min_count: 2
  hallucination_tolerance: 0
  curve_metric_pass_min: 6
  forbidden_experiment_blocked: true
  forbidden_pattern_absent: true
  stat5_must_decline: true
  socs3_feedback_required: true

expected_curve_metrics:
  pstat5_peak_time_min: [5, 15]
  pstat5_peak_amplitude: [0.8, 1.0]
  pstat5_adaptation_ratio: [0.1, 0.5]       # 必须 < 1.0，证明下降
  pstat5_steady_state_vs_peak: [0.1, 0.5]
  pstat5_half_decay_min: [20, 60]
  pstat5_oscillation: false
  socs3_increase_required: true

# Agent 预期行为（保留 Task 27 字段以兼容）
input:
  hypothesis: "JAK-STAT 通路无 SOCS 反馈，STAT5 持续高位"
  pathway_class: JAK_STAT
  species: ["Cytokine", "JAK", "STAT5", "SOCS3", "CIS"]
  duration: 120

false_premise:
  description: "JAK-STAT 无 SOCS 反馈，STAT5 持续高位"
  violation_type: "feedback_missing"
  violated_consistency_rule: "socs_feedback == required (SOCS3/CIS 负反馈必然导致 STAT5 transient decline)"
  canonical_violation_label: "missing_negative_feedback"

expected_agent_behavior:
  must_detect: true
  must_reject: true
  must_cite_canonical: true
  must_explain: true
  forbidden_outputs:
    - "生成 STAT5 持续高位不下降的 ODE"
    - "接受 JAK-STAT 无 SOCS 反馈的假设"
    - "省略 SOCS3/CIS 负反馈项"

failure_patterns:
  - "Agent 直接生成 STAT5 持续高位的 ODE（无 SOCS 抑制项）"
  - "Agent 说 '好的，JAK-STAT 无 SOCS 反馈' 然后顺从"
  - "Agent 仿真显示 STAT5 在 2h 内无下降"

canonical_reference: "knowledge/canonical/jak_stat.yaml"
canonical_reviews:
  - "PMID:12552139"         # Swameye 2003 PNAS
  - "PMID:17502367"         # Schindler 2007 J Biol Chem
  - "PMID:12040185"         # Aaronson 2002 Science
canonical_models: []
