# Golden Benchmark — p53 Pathway
pathway: p53
question: "DNA damage activates ATM, leading to p53 phosphorylation. p53 and MDM2 form a negative feedback loop producing oscillatory dynamics with a period of approximately 5-6 hours. Explain the p53-MDM2 oscillation mechanism and simulate expected dynamics after DNA damage."
ground_truth: "DNA damage activates ATM within <30 min, which phosphorylates p53 at 30-60 min [PMID:14977579]. p53 transcriptionally induces MDM2, with MDM2 peak occurring 1-2 h after p53 peak [PMID:14977579]. MDM2 in turn targets p53 for degradation, forming a negative feedback loop (MDM2-p53) that produces sustained oscillations in p53 levels with a pulse period of 5-6 h [PMID:14977579]. p53 also induces p21 at 2-4 h, which inhibits CDK to arrest the cell cycle [PMID:14977579]. The p53-MDM2 negative feedback is required for the oscillatory dynamics; MDM2 feedback is the essential mediator [PMID:14977579]."
canonical_papers: ["PMID:14977579"]  # Lahav 2004 Nature Genetics（p53-MDM2 动力学）
canonical_biomodels: ["BIOMD0000000252"]  # Hunziker2010 p53 stress response
expected_mechanism: [ATM, p53, MDM2, p21]
expected_time_scale:
  atm_activation: "<30 min"
  p53_phosphorylation: "30-60 min"
  mdm2_peak: "1-2 h after p53"
  p53_oscillation_period: "5-6 h"
  p21_induction: "2-4 h"
